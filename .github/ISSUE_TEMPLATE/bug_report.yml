name: Bug report
description: Something in Lodestar does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste API keys, resumes or call transcripts here. Redact them.
        For a security vulnerability, do not use this form: see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Lodestar version
      description: Shown in the installer file name and on the release you installed.
      placeholder: "0.4.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: For example Windows 11 23H2, x64.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Answer engine, transcription engine, capture source, and whether the phone server was running.
