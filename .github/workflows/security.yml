name: Security Scan

on:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC
  pull_request:
    # docs-only changes skip this to save Actions minutes
    paths-ignore: ['*.md', 'docs/**', '.claude/**', 'LICENSE*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    uses: w1ck3ds0d4/SecureCheck/.github/workflows/scan.yml@v1
    secrets: inherit
