name: CI

on:
  pull_request:
    # docs-only changes skip this to save Actions minutes
    paths-ignore: ['*.md', 'docs/**', 'LICENSE*']
  # weekly on main: keeps the Rust cache warm for pull requests and catches toolchain drift
  schedule:
    - cron: '30 5 * * 1' # Monday 05:30 UTC
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    # Feeds the Windows job below: on a pull request it says whether src-tauri/ or this file changed.
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # On a pull request HEAD is the merge commit, so HEAD^1..HEAD is exactly the PR's change.
          if [ "$EVENT" != "pull_request" ] || git diff --name-only HEAD^1 HEAD | grep -qE '^(src-tauri/|\.github/workflows/ci\.yml$)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  frontend:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check and build frontend
        run: pnpm build

      - name: Frontend unit tests
        run: pnpm test

  rust:
    # Windows: the app depends on Windows-only crates (UI Automation, screen
    # capture, window effects), so the Rust side only compiles here.
    needs: [changes]
    # Windows minutes count double on a private repo's free plan, so there it runs only on the Monday
    # schedule or by hand. On a public repo Actions minutes are free, and a pull request that changes
    # src-tauri/ or this file runs it too.
    if: github.event_name != 'pull_request' || (!github.event.repository.private && needs.changes.outputs.rust == 'true')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds the frontend into dist/, which the Rust build (generate_context!)
      # needs before clippy/test will compile.
      - name: Build frontend
        run: pnpm build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test

  # Dormant since 2026-10-27: Dependabot PRs skip CI to save minutes, so this never fires.
  # They are checked locally once a week and merged by hand.
  automerge:
    name: Auto-merge Dependabot patch updates
    needs: [frontend, rust]
    # always() so a skipped Windows job (no Rust change) still lets a passing frontend merge
    if: >-
      always() && github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
      && needs.frontend.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.rust.result)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - name: Merge when every update in the PR is a patch
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          t="${PR_TITLE#chore: }"
          gh pr merge "$PR_URL" --squash --subject "(chore) ${t,,} (#$PR_NUMBER)" --body ""
