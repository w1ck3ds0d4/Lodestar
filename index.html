<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobRadar</title>
    <!-- Splash styles are inline so the loading screen paints instantly, before the
         JS bundle and styles.css load (no blank/clunky window on launch). React
         removes #jr-splash once the first data load finishes. -->
    <style>
      #jr-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background:
          radial-gradient(1100px 560px at 100% -8%, rgba(16, 185, 129, 0.06), transparent 60%),
          radial-gradient(900px 500px at -5% 0%, rgba(52, 211, 153, 0.04), transparent 55%), #0e1626;
        color: #e8eef9;
        font: 15px/1.5 system-ui, "Segoe UI", Roboto, sans-serif;
        transition: opacity 0.35s ease;
      }
      #jr-splash.jr-hide {
        opacity: 0;
        pointer-events: none;
      }
      .jr-splash-brand {
        display: flex;
        align-items: center;
        gap: 11px;
        font-weight: 700;
        font-size: 22px;
        letter-spacing: 0.3px;
      }
      .jr-splash-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #34d399;
        animation: jr-pulse 1.4s infinite;
      }
      @keyframes jr-pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.5);
        }
        70% {
          box-shadow: 0 0 0 16px rgba(52, 211, 153, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(52, 211, 153, 0);
        }
      }
      .jr-splash-bar {
        width: 170px;
        height: 3px;
        border-radius: 999px;
        background: #25344f;
        overflow: hidden;
      }
      .jr-splash-bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #10b981, #34d399);
        animation: jr-slide 1.1s infinite ease-in-out;
      }
      @keyframes jr-slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }
      .jr-splash-sub {
        color: #94a4c0;
        font-size: 12.5px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="jr-splash">
      <div class="jr-splash-brand"><span class="jr-splash-dot"></span> JobRadar</div>
      <div class="jr-splash-bar"></div>
      <div class="jr-splash-sub">Loading your job radar…</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
