<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>JobRadar Remote</title>
    <style>
      :root {
        --bg: #0e1626; --panel: #16223b; --panel2: #1b2942; --border: #25344f;
        --text: #e8eef9; --muted: #94a4c0; --accent: #10b981; --accent2: #34d399; --danger: #f87171;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; height: 100%; }
      body { background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      button { font: inherit; color: inherit; }
      .hidden { display: none !important; }

      /* PIN gate */
      .center { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100dvh; gap: 14px; padding: 24px; }
      .center input { width: 200px; text-align: center; font-size: 22px; letter-spacing: 4px; background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 12px; padding: 12px; }
      .center .connect { border: 1px solid var(--accent); color: var(--accent2); background: rgba(16,185,129,.14); border-radius: 12px; padding: 11px 20px; cursor: pointer; }
      .brand { font-weight: 700; font-size: 18px; }
      .hint { color: var(--muted); font-size: 13px; text-align: center; max-width: 260px; }
      .err { color: var(--danger); font-size: 14px; min-height: 18px; }

      /* 8-tile remote: a 2-by-4 grid of big tap targets that fills the screen. */
      .grid { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 12px; padding: 12px; height: 100dvh; }
      .tile {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
        border: 1px solid var(--border); background: var(--panel); border-radius: 16px; padding: 14px;
        font-size: 17px; font-weight: 600; text-align: center; cursor: pointer;
      }
      .tile:active { transform: scale(0.97); }
      .tile:disabled { opacity: 0.5; }
      .tile.on { border-color: var(--accent); color: var(--accent2); background: rgba(16,185,129,.16); }
      .tile .st { font-size: 12px; font-weight: 500; color: var(--muted); }
      .tile.on .st { color: var(--accent2); }

      /* Monitor chooser: shown by Read & Answer when more than one display is connected,
         so you pick which screen to read from the phone. */
      .modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 10; }
      .sheet { width: 100%; max-width: 320px; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
      .sheet-title { font-weight: 700; text-align: center; }
      .sheet-btns { display: flex; flex-direction: column; gap: 10px; }
      .sheet-btns button { border: 1px solid var(--accent); color: var(--accent2); background: rgba(16,185,129,.14); border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer; }
      .sheet-cancel { border: 1px solid var(--border); color: var(--muted); background: var(--panel2); border-radius: 12px; padding: 11px; cursor: pointer; }
    </style>
  </head>
  <body>
    <!-- PIN gate -->
    <div id="gate" class="center">
      <div class="brand">JobRadar Remote</div>
      <div class="hint">Scan the QR on your computer to connect, or enter the PIN shown there.</div>
      <input id="pin" inputmode="numeric" maxlength="6" placeholder="••••••" />
      <button class="connect" id="connect">Connect</button>
      <div class="err" id="gateErr"></div>
    </div>

    <!-- 8-tile remote (no nav or bottom bar; every action is one tap) -->
    <div id="app" class="grid hidden">
      <button class="tile" id="listen"><span class="tl">Audio Capture</span><span class="st" id="listenSt">Off</span></button>
      <button class="tile" id="capture"><span class="tl">Screen Capture</span><span class="st" id="captureSt">Off</span></button>
      <button class="tile" id="opUp"><span class="tl">Opacity +</span><span class="st">More opaque</span></button>
      <button class="tile" id="opDown"><span class="tl">Opacity −</span><span class="st">More see-through</span></button>
      <button class="tile" id="screen"><span class="tl">Read &amp; Answer</span><span class="st">Full page + screen</span></button>
      <button class="tile" id="watch"><span class="tl">Watch Screen</span><span class="st" id="watchSt">Off</span></button>
      <button class="tile" id="panels"><span class="tl">Hide / Show</span><span class="st">Overlay panels</span></button>
      <button class="tile" id="ask"><span class="tl">Ask</span><span class="st">Type a question</span></button>
    </div>

    <!-- Monitor chooser (only shown when more than one display is connected) -->
    <div id="monModal" class="modal hidden">
      <div class="sheet">
        <div class="sheet-title">Answer which screen?</div>
        <div id="monBtns" class="sheet-btns"></div>
        <button class="sheet-cancel" id="monCancel">Cancel</button>
      </div>
    </div>

    <script>
      var ws = null, pin = "", connected = false, monitors = 1;
      var $ = function (id) { return document.getElementById(id); };
      function show(el, on) { el.classList.toggle("hidden", !on); }

      function cmd(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
      function setOn(tile, stEl, on) { tile.classList.toggle("on", !!on); if (stEl) stEl.textContent = on ? "On" : "Off"; }

      // Each tile sends one command. The desktop executes it and broadcasts back state,
      // which lights up the toggle tiles (Audio Capture, Screen Capture, Watch).
      $("listen").onclick  = function () { cmd({ cmd: "listen" }); };
      $("capture").onclick = function () { cmd({ cmd: "capture" }); };
      $("opUp").onclick    = function () { cmd({ cmd: "opacity", dir: "up" }); };
      $("opDown").onclick  = function () { cmd({ cmd: "opacity", dir: "down" }); };
      $("screen").onclick  = function () {
        // One display: answer it straight away. More than one: ask which screen first.
        if (monitors > 1) openMonModal();
        else cmd({ cmd: "answer_screen", monitor: 0 });
      };
      $("watch").onclick   = function () { cmd({ cmd: "watch" }); };
      $("panels").onclick  = function () { cmd({ cmd: "panels" }); };
      $("ask").onclick     = function () {
        var v = (window.prompt("Ask a question") || "").trim();
        if (v) cmd({ cmd: "ask", text: v });
      };

      // Build one button per connected display, each answering that monitor.
      function openMonModal() {
        var box = $("monBtns");
        box.innerHTML = "";
        for (var i = 0; i < monitors; i++) {
          (function (idx) {
            var b = document.createElement("button");
            b.textContent = "Display " + (idx + 1);
            b.onclick = function () { cmd({ cmd: "answer_screen", monitor: idx }); show($("monModal"), false); };
            box.appendChild(b);
          })(i);
        }
        show($("monModal"), true);
      }
      $("monCancel").onclick = function () { show($("monModal"), false); };

      function connect() {
        pin = $("pin").value.trim();
        if (pin.length < 4) { $("gateErr").textContent = "Enter the PIN."; return; }
        $("gateErr").textContent = "Connecting…";
        ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
        ws.onopen = function () { ws.send(JSON.stringify({ pin: pin })); };
        ws.onmessage = function (ev) {
          var msg;
          try { msg = JSON.parse(ev.data); } catch (e) { return; }
          if (msg.type === "auth") {
            if (msg.ok) { connected = true; show($("gate"), false); show($("app"), true); }
            else { $("gateErr").textContent = "Wrong PIN."; ws.close(); }
          } else if (msg.type === "state") {
            setOn($("listen"), $("listenSt"), msg.listening);
            setOn($("capture"), $("captureSt"), msg.capture);
            setOn($("watch"), $("watchSt"), msg.watching);
            if (typeof msg.monitors === "number") monitors = msg.monitors;
          }
        };
        ws.onclose = function () {
          if (connected) { show($("app"), false); show($("gate"), true); $("gateErr").textContent = "Disconnected - reconnect."; }
          connected = false;
        };
        ws.onerror = function () { $("gateErr").textContent = "Could not connect."; };
      }
      $("connect").onclick = connect;
      $("pin").addEventListener("keydown", function (e) { if (e.key === "Enter") connect(); });

      // Scanned QR carries the PIN in the URL fragment (#pin=...) - connect straight away.
      var auto = (location.hash + "&" + location.search).match(/[#&?]pin=(\d{4,8})/);
      if (auto) { $("pin").value = auto[1]; connect(); }
    </script>
  </body>
</html>
