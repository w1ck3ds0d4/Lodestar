[package]
name = "jobradar"
version = "0.1.0"
description = "JobRadar - a local-first desktop app that searches the job market"
authors = ["w1ck3ds0d4 <support@wickitlab.com>"]
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/w1ck3ds0d4/JobRadar"
homepage = "https://github.com/w1ck3ds0d4/JobRadar"
readme = "../README.md"
keywords = ["job-search", "jobs", "tauri", "aggregator", "desktop"]
categories = ["gui"]

[lib]
name = "jobradar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No "devtools" feature: debug builds enable devtools automatically, while release
# builds ship without them (the feature is only needed to force-enable in release).
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Pull in the ring CryptoProvider so we can install it as the process default before
# tokio-tungstenite opens its wss:// socket (rustls 0.23 panics without one).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
cpal = "0.15"
xcap = "0.0.14"
base64 = "0.22"
sha2 = "0.10"
arboard = "3"
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"
tokenizers = "0.23.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
incremental = false
