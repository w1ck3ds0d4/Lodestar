[package]
name = "lodestar"
version = "0.4.0"
description = "Lodestar - a local-first, real-time interview copilot for the desktop"
authors = ["WickIT Lab <support@wickitlab.com>"]
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/w1ck3ds0d4/Lodestar"
homepage = "https://github.com/w1ck3ds0d4/Lodestar"
readme = "../README.md"
keywords = ["interview", "copilot", "tauri", "desktop", "transcription"]
categories = ["gui"]

[lib]
name = "lodestar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The compiled executable is named `mcp_lodestar` (deliberately not the product
# name "Lodestar") so a companion app can find and attach to the process by a
# stable, unique image name. `mainBinaryName` in tauri.conf.json must match this.
[[bin]]
name = "mcp_lodestar"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No "devtools" feature: debug builds enable devtools automatically, while release
# builds ship without them (the feature is only needed to force-enable in release).
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
# Local LAN companion server (phone control): tiny axum HTTP+WebSocket server.
axum = { version = "0.8", features = ["ws"] }
local-ip-address = "0.6"
qrcode = "0.14"
rand = "0.10"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Pull in the ring CryptoProvider so we can install it as the process default before
# tokio-tungstenite opens its wss:// socket (rustls 0.23 panics without one).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
rusqlite = { version = "0.40", features = ["bundled"] }
# Pure-Rust XML pull parser for the RSS / We Work Remotely feed sources (handles
# CDATA + entity decoding properly, unlike a regex).
# Offline, pure-Rust language detection (no model downloads) for the language filter.
cpal = "0.18"
xcap = "0.9.6"
base64 = "0.23"
sha2 = "0.11"
arboard = "3"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
tokenizers = "0.23.1"
nvml-wrapper = "0.13.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Security_Cryptography"] }
# High-level Windows UI Automation wrapper used to read the focused window's text
# (problem statement + editor) when a page disables copy/select.
uiautomation = "0.25"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
incremental = false
